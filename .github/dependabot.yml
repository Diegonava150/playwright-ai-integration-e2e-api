version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Group ONLY low-risk dev-tooling minor/patch bumps into one PR. Majors are
      # excluded so they arrive as individual, reviewable PRs instead of one
      # incoherent bundle (a grouped major bump of e.g. TypeScript broke lint
      # because typescript-eslint's peer range lagged the new compiler).
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript majors are a deliberate migration (typescript-eslint peer
      # ranges trail new compiler majors); bump it by hand, not via auto-PR.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
