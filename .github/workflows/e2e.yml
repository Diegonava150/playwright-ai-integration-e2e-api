name: Playwright E2E + API

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  SHARD_TOTAL: 2

# Default token perms; the Pages job widens its own below.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  quality:
    name: Lint · Typecheck · Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Audit (non-blocking)
        run: npm audit --audit-level=high || true

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: gitleaks (working tree)
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo"
          zricethezav/gitleaks:latest
          detect --source=/repo --no-git --redact --verbose

  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  # The public demo (automationexercise.com) serves an anti-bot JS challenge to
  # datacenter IPs (incl. GitHub runners), so the live-site suites can't run here.
  # Detect that and skip them gracefully instead of failing the build. They run
  # locally (residential IP) — that's where they're green.
  preflight:
    name: Preflight (target reachable?)
    runs-on: ubuntu-latest
    outputs:
      blocked: ${{ steps.probe.outputs.blocked }}
    steps:
      - id: probe
        run: |
          curl -s -m 30 -A "Mozilla/5.0 (X11; Linux x86_64)" \
            https://www.automationexercise.com/api/productsList -o body.txt || true
          if grep -q '"responseCode"' body.txt 2>/dev/null; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            echo "Target returned real API content — running live-site suites."
          else
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Live suites skipped::automationexercise.com is serving an anti-bot challenge to this runner; the api/e2e/e2e-auth/hybrid/a11y suites are skipped. They run locally (residential IP). Unit, lint, typecheck and secret-scan gates still enforce quality here."
          fi

  test:
    name: Tests (shard ${{ matrix.shard }}/2)
    needs: [preflight]
    if: needs.preflight.outputs.blocked == 'false'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run suites (sharded, blob report)
        run: >
          npx playwright test
          --project=api --project=e2e --project=e2e-auth --project=hybrid --project=a11y
          --reporter=blob
          --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  merge:
    name: Merge reports + AI triage
    needs: [preflight, test]
    if: always() && needs.preflight.outputs.blocked == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML + JSON report
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: npx playwright merge-reports --config playwright.config.ts ./all-blob-reports

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # AI failure triage — reuses scripts/ai-failure-summary.ts. Needs the secret
      # to call Claude; otherwise it emits a plain failure list and exits 0.
      - name: AI failure summary
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run ai:summary

      - name: Add AI summary to job summary
        if: always()
        run: cat ai-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload AI summary
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ai-summary
          path: ai-summary.md
          retention-days: 14

      # Post the AI triage as a PR comment (upsert by a hidden marker).
      - name: Comment AI summary on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ai-test-summary -->';
            let body = marker + '\n';
            try { body += fs.readFileSync('ai-summary.md', 'utf8'); }
            catch { body += '# AI Test Summary\n\n_No summary produced._'; }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            body += `\n\n[Full HTML report & traces →](${runUrl})`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # Publish the merged HTML report to GitHub Pages (main pushes only).
  # Requires Settings → Pages → Source: "GitHub Actions".
  deploy-report:
    name: Publish report to Pages
    needs: [preflight, merge]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.preflight.outputs.blocked == 'false'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report
      - id: deploy
        uses: actions/deploy-pages@v4
