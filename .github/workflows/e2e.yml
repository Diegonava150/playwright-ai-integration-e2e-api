name: Playwright E2E + API

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  SHARD_TOTAL: 2

# Default token perms; the Pages job widens its own below.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  quality:
    name: Lint · Typecheck · Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Audit (non-blocking)
        run: npm audit --audit-level=high || true

  # Three things were wrong with the first version of this job, none of which showed up as a
  # failure — it passed every run, which is the only symptom a bad scanner has.
  #
  #   --no-git scanned the working tree only. A key committed once and deleted in the next commit
  #   is still in the pack file, still reachable by anyone who clones, and still has to be
  #   rotated; removing the line does not unpublish it. The scan reported that repository clean.
  #
  #   zricethezav/gitleaks is the pre-transfer image name and :latest is unpinned. This is the
  #   openjdk:8-jre-alpine shape of problem exactly: an unpinned base that someone else can
  #   delete, breaking the job with no change on our side.
  #
  #   Nothing proved the scanner ran. gitleaks pointed at a path that does not exist exits 0,
  #   which is byte-identical to a clean result.
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history. The default shallow clone fetches one commit, and "no leaks found"
          # after scanning one commit is worse than no scan, because it is believed.
          fetch-depth: 0

      # Prove the check can fail before believing that it passed. The key is generated here,
      # random, valid nowhere, and written outside the workspace so it can reach neither the
      # scan below nor a commit.
      - name: Prove the scanner can fail
        run: |
          canary="$RUNNER_TEMP/canary"
          mkdir -p "$canary"
          printf 'ANTHROPIC_API_KEY=sk-ant-api03-%sAA\n' \
            "$(head -c 300 /dev/urandom | base64 | tr -dc 'A-Za-z0-9_-' | head -c 93)" \
            > "$canary/planted.env"

          if docker run --rm -v "$canary:/scan" "$GITLEAKS_IMAGE" \
               detect --source=/scan --no-git --redact --no-banner; then
            echo "::error::gitleaks reported clean on a directory containing a planted key."
            echo "::error::The scan below would report clean too, whatever this repository contains."
            exit 1
          fi
          echo "Planted key was caught, so a clean result below means something."

      - name: Scan the full history
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            detect --source=/repo --redact --verbose --no-banner

  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  test:
    name: Tests (shard ${{ matrix.shard }}/2)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run suites (sharded, blob report)
        run: >
          npx playwright test
          --project=api --project=e2e --project=e2e-auth --project=hybrid --project=a11y
          --reporter=blob
          --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  merge:
    name: Merge reports + AI triage
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      executed: ${{ steps.executed.outputs.executed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML + JSON report
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: npx playwright merge-reports --config playwright.config.ts ./all-blob-reports

      # Did anything actually execute, or did every test skip because this runner was
      # being served the challenge?
      #
      # The gate that used to answer this was the preflight job, and it answered it about a
      # different machine. Reading it off the report instead is both correct and unfalsifiable:
      # the report is the record of what ran.
      #
      # Only Pages publication depends on the answer — an all-skipped run must not overwrite a
      # real published report with an empty one.
      - name: Did any test run
        id: executed
        if: always()
        run: |
          executed=$(python3 - <<'PY'
          import json
          try:
              stats = json.load(open('test-results/results.json'))['stats']
          except Exception:
              print('false'); raise SystemExit
          ran = stats.get('expected', 0) + stats.get('unexpected', 0) + stats.get('flaky', 0)
          print('true' if ran > 0 else 'false')
          PY
          )
          echo "executed=$executed" >> "$GITHUB_OUTPUT"
          if [ "$executed" = "false" ]; then
            echo "::notice title=Live suites skipped::Every test skipped — this runner is being served the anti-bot challenge. Pages publication is skipped so the existing report is not replaced with an empty one."
          fi

      - name: Upload merged HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # AI failure triage — reuses scripts/ai-failure-summary.ts. Needs the secret
      # to call Claude; otherwise it emits a plain failure list and exits 0.
      - name: AI failure summary
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run ai:summary

      - name: Add AI summary to job summary
        if: always()
        run: cat ai-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload AI summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-summary
          path: ai-summary.md
          retention-days: 14

      # Post the AI triage as a PR comment (upsert by a hidden marker).
      - name: Comment AI summary on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ai-test-summary -->';
            let body = marker + '\n';
            try { body += fs.readFileSync('ai-summary.md', 'utf8'); }
            catch { body += '# AI Test Summary\n\n_No summary produced._'; }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            body += `\n\n[Full HTML report & traces →](${runUrl})`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # Publish the merged HTML report to GitHub Pages (main pushes only).
  # Requires Settings → Pages → Source: "GitHub Actions".
  deploy-report:
    name: Publish report to Pages
    needs: [merge]
    if: >
      github.ref == 'refs/heads/main' && github.event_name == 'push'
      && needs.merge.outputs.executed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: playwright-report
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report
      - id: deploy
        uses: actions/deploy-pages@v5
